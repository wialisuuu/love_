<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ввод кода</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Manrope:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      background-color: #5C7C36;
      overflow: hidden;
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Manrope', sans-serif;
    }

    /* Контейнер на весь экран телефона */
    .screen {
      position: relative;
      width: 100%;
      max-width: 402px;
      height: 100%;
      background-color: #5C7C36;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      transition: transform 0.25s ease;
    }

    /* Сдвиг вверх при открытии клавиатуры */
    .screen.keyboard-open {
      transform: translateY(-95px);
    }

    /* Центральный блок: 6 ячеек + кот */
    .center-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      width: 100%;
      padding: 0 16px;
    }

    /* Ряд с 6 ячейками */
    .inputs-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      width: 100%;
    }

    /* Обертка для ячейки и нижней полоски */
    .input-box {
      position: relative;
      width: 49px;
      height: 51px;
    }

    /* Поле ввода (стиль из Figma) */
    .code-input {
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid #D1D1D6;
      box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
      border-radius: 8px;
      
      font-family: 'Manrope', sans-serif;
      font-size: 22px;
      font-weight: 600;
      color: #FFFFFF;
      text-align: center;
      padding-bottom: 6px;
      outline: none;
      caret-color: #FFFFFF;
    }

    .code-input:focus {
      border-color: #FFFFFF;
      background: rgba(255, 255, 255, 0.22);
    }

    /* Нижняя линия внутри каждой ячейки */
    .input-box::after {
      content: '';
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 34px;
      height: 1px;
      background-color: #A6A6B0;
      pointer-events: none;
    }

    /* Картинка с котом */
    .cat-image {
      width: 136px;
      height: 136px;
      object-fit: cover;
      border-radius: 4px;
      user-select: none;
    }

    /* Знаки вопроса на фоне (в процентах, чтобы работали на любом экране без обрезки) */
    .q-mark {
      position: absolute;
      z-index: 1;
      font-family: 'Manrope', sans-serif;
      font-weight: 400;
      font-size: 16px;
      line-height: 20px;
      color: #A6A6B0;
      user-select: none;
      pointer-events: none;
    }

    .q1  { left: 21%; top: 57%; }
    .q2  { left: 89%; top: 82%; transform: rotate(25.54deg); }
    .q3  { left: 45%; top: 76%; transform: rotate(51.08deg); }
    .q4  { left: 92%; top: 5%;  transform: rotate(76.62deg); }
    .q5  { left: 83%; top: 92%; transform: rotate(102.15deg); }
    .q6  { left: 13%; top: 91%; transform: rotate(127.69deg); }
    .q7  { left: 49%; top: 94%; transform: rotate(153.23deg); }
    .q8  { left: 16%; top: 10%; transform: rotate(178.77deg); }
    .q9  { left: 87%; top: 70%; transform: rotate(-155.69deg); }
    .q10 { left: 11%; top: 78%; transform: rotate(-130.15deg); }
    .q11 { left: 10%; top: 50%; transform: rotate(-104.62deg); }
    .q12 { left: 35%; top: 88%; transform: rotate(-79.08deg); }
    .q13 { left: 50%; top: 6%;  transform: rotate(-53.54deg); }
    .q14 { left: 43%; top: 48%; transform: rotate(-28deg); }
    .q15 { left: 81%; top: 52%; transform: rotate(1.6deg); }
    .q16 { left: 44%; top: 59%; transform: rotate(1.6deg); }
    .q17 { left: 17%; top: 67%; transform: rotate(1.6deg); }
    .q18 { left: 60%; top: 82%; transform: rotate(1.6deg); }
    .q19 { left: 90%; top: 22%; transform: rotate(1.6deg); }
    .q20 { left: 72%; top: 15%; transform: rotate(15deg); }
    .q21 { left: 28%; top: 25%; transform: rotate(-20deg); }
  </style>
</head>
<body>

  <div class="screen" id="screen">
    <!-- Декоративные знаки вопроса -->
    <span class="q-mark q1">?</span>
    <span class="q-mark q2">?</span>
    <span class="q-mark q3">?</span>
    <span class="q-mark q4">?</span>
    <span class="q-mark q5">?</span>
    <span class="q-mark q6">?</span>
    <span class="q-mark q7">?</span>
    <span class="q-mark q8">?</span>
    <span class="q-mark q9">?</span>
    <span class="q-mark q10">?</span>
    <span class="q-mark q11">?</span>
    <span class="q-mark q12">?</span>
    <span class="q-mark q13">?</span>
    <span class="q-mark q14">?</span>
    <span class="q-mark q15">?</span>
    <span class="q-mark q16">?</span>
    <span class="q-mark q17">?</span>
    <span class="q-mark q18">?</span>
    <span class="q-mark q19">?</span>
    <span class="q-mark q20">?</span>
    <span class="q-mark q21">?</span>

    <!-- Центральный блок с полями и котом -->
    <div class="center-content">
      <div class="inputs-row">
        <div class="input-box"><input type="text" maxlength="1" class="code-input" autocomplete="off"></div>
        <div class="input-box"><input type="text" maxlength="1" class="code-input" autocomplete="off"></div>
        <div class="input-box"><input type="text" maxlength="1" class="code-input" autocomplete="off"></div>
        <div class="input-box"><input type="text" maxlength="1" class="code-input" autocomplete="off"></div>
        <div class="input-box"><input type="text" maxlength="1" class="code-input" autocomplete="off"></div>
        <div class="input-box"><input type="text" maxlength="1" class="code-input" autocomplete="off"></div>
      </div>

      <img src="cat.jpg" alt="Кот" class="cat-image">
    </div>
  </div>

  <script>
    const screen = document.getElementById('screen');
    const inputs = document.querySelectorAll('.code-input');

    inputs.forEach((input, index) => {
      // Подъем при открытии клавиатуры
      input.addEventListener('focus', () => {
        screen.classList.add('keyboard-open');
      });

      input.addEventListener('blur', () => {
        setTimeout(() => {
          if (!document.activeElement.classList.contains('code-input')) {
            screen.classList.remove('keyboard-open');
          }
        }, 100);
      });

      // Переход к следующей ячейке
      input.addEventListener('input', (e) => {
        if (e.target.value.length === 1 && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
      });

      // Возврат при удалении
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
          inputs[index - 1].focus();
        }
      });
    });
  </script>
</body>
</html>
