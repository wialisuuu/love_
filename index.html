<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ввод кода</title>
  <!-- Подключаем шрифт Manrope из Figma -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Manrope:wght@400;600&display=swap" rel="stylesheet">
  <img src="cat.jpg" alt="Кот" class="cat-image">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #5C7C36; /* Зеленый фон со скриншота */
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: 'Manrope', sans-serif;
    }

    /* Контейнер под размер экрана iPhone (390x844) */
    .screen {
      position: fixed;
      width: 402px;
      height: 100dvh;
      background-color: #5C7C36;
      overflow: hidden;
      transform-origin: top center;
    }

    /* Ячейки ввода (Input - Number - QWERTY) */
    .code-input {
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 12px 4px;
      position: absolute;
      height: 51px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid #D1D1D6;
      box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
      border-radius: 8px;
      
      /* Стиль текста внутри ячейки */
      font-family: 'Manrope', sans-serif;
      font-size: 22px;
      font-weight: 600;
      color: #FFFFFF;
      text-align: center;
      outline: none;
      caret-color: #FFFFFF;
    }

    .code-input:focus {
      border-color: #FFFFFF;
      background: rgba(255, 255, 255, 0.2);
    }

    /* Точные координаты ячеек из Figma */
    .input-1 { width: 49px; left: 20px;  top: 302px; }
    .input-2 { width: 49px; left: 81px;  top: 302px; }
    .input-3 { width: 50px; left: 136px; top: 302px; }
    .input-4 { width: 51px; left: 196px; top: 302px; }
    .input-5 { width: 49px; left: 258px; top: 302px; }
    .input-6 { width: 49px; left: 319px; top: 304px; }

    /* Нижние линии внутри ячеек (Line 1 - Line 6) */
    .line {
      position: absolute;
      height: 0px;
      top: 347px;
      border-top: 1px solid #A6A6B0;
      pointer-events: none;
    }

    .line-1 { width: 34px; left: 29px; }
    .line-2 { width: 33px; left: 90px; }
    .line-3 { width: 33px; left: 145px; }
    .line-4 { width: 35px; left: 204px; }
    .line-5 { width: 36px; left: 265px; }
    .line-6 { width: 36px; left: 325px; }

    /* Картинка с котом по центру */
    .cat-image {
      position: absolute;
      width: 136px;
      height: 136px;
      left: 127px;
      top: 375px;
      object-fit: cover;
      border-radius: 2px;
      user-select: none;
    }

    /* Знаки вопроса на фоне */
    .q-mark {
      position: absolute;
      width: 9px;
      height: 21px;
      font-family: 'Manrope', sans-serif;
      font-style: normal;
      font-weight: 400;
      font-size: 16px;
      line-height: 20px;
      color: #A6A6B0;
      user-select: none;
      pointer-events: none;
    }

    /* Точные координаты и повороты из вашего CSS */
    .q1  { left: 82px;     top: 484px; }
    .q2  { left: 350px;    top: 694px;    transform: rotate(25.54deg); }
    .q3  { left: 177.18px; top: 647.54px; transform: rotate(51.08deg); }
    .q4  { left: 364px;    top: 36px;     transform: rotate(76.62deg); }
    .q5  { left: 327px;    top: 805px;    transform: rotate(102.15deg); }
    .q6  { left: 50px;     top: 801px;    transform: rotate(127.69deg); }
    .q7  { left: 191px;    top: 829px;    transform: rotate(153.23deg); }
    .q8  { left: 63px;     top: 88px;     transform: rotate(178.77deg); }
    .q9  { left: 342px;    top: 594px;    transform: rotate(-155.69deg); }
    .q10 { left: 43px;     top: 659px;    transform: rotate(-130.15deg); }
    .q11 { left: 40px;     top: 422px;    transform: rotate(-104.62deg); }
    .q12 { left: 136px;    top: 748px;    transform: rotate(-79.08deg); }
    .q13 { left: 195px;    top: 44px;     transform: rotate(-53.54deg); }
    .q14 { left: 170px;    top: 411px;    transform: rotate(-28deg); }
    .q15 { left: 318px;    top: 439px;    transform: rotate(1.6deg); }
    .q16 { left: 173px;    top: 498px;    transform: rotate(1.6deg); }
    .q17 { left: 68px;     top: 571px;    transform: rotate(1.6deg); }
    .q18 { left: 236px;    top: 697px;    transform: rotate(1.6deg); }
    .q19 { left: 356px;    top: 186px;    transform: rotate(1.6deg); }
    /* Дополнительные верхние знаки со скриншота */
    .q20 { left: 280px;    top: 130px;    transform: rotate(15deg); }
    .q21 { left: 165px;    top: 215px;    transform: rotate(-20deg); }
  </style>
</head>
<body>

  <div class="screen" id="screen">
    <!-- Декоративные знаки вопроса -->
    <span class="q-mark q1">?</span>
    <span class="q-mark q2">?</span>
    <span class="q-mark q3">?</span>
    <span class="q-mark q4">?</span>
    <span class="q-mark q5">?</span>
    <span class="q-mark q6">?</span>
    <span class="q-mark q7">?</span>
    <span class="q-mark q8">?</span>
    <span class="q-mark q9">?</span>
    <span class="q-mark q10">?</span>
    <span class="q-mark q11">?</span>
    <span class="q-mark q12">?</span>
    <span class="q-mark q13">?</span>
    <span class="q-mark q14">?</span>
    <span class="q-mark q15">?</span>
    <span class="q-mark q16">?</span>
    <span class="q-mark q17">?</span>
    <span class="q-mark q18">?</span>
    <span class="q-mark q19">?</span>
    <span class="q-mark q20">?</span>
    <span class="q-mark q21">?</span>

    <!-- 6 полей для ввода -->
    <input type="text" maxlength="1" class="code-input input-1" autocomplete="off">
    <input type="text" maxlength="1" class="code-input input-2" autocomplete="off">
    <input type="text" maxlength="1" class="code-input input-3" autocomplete="off">
    <input type="text" maxlength="1" class="code-input input-4" autocomplete="off">
    <input type="text" maxlength="1" class="code-input input-5" autocomplete="off">
    <input type="text" maxlength="1" class="code-input input-6" autocomplete="off">

    <!-- Линии внутри полей -->
    <div class="line line-1"></div>
    <div class="line line-2"></div>
    <div class="line line-3"></div>
    <div class="line line-4"></div>
    <div class="line line-5"></div>
    <div class="line line-6"></div>

    <!-- Картинка с котом (положите файл cat.jpg рядом с index.html) -->
    <img src="cat.jpg" alt="Кот" class="cat-image">
  </div>

  <script>
    // Масштабирование экрана под любую модель iPhone
    function scaleToFit() {
      const screen = document.getElementById('screen');
      const scale = window.innerWidth / 390;
      screen.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', scaleToFit);
    scaleToFit();

    // Логика автоматического перехода между ячейками при вводе
    const inputs = document.querySelectorAll('.code-input');

    inputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        if (e.target.value.length === 1 && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
        checkCode();
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
          inputs[index - 1].focus();
        }
      });
    });

    // Функция проверки введенного кода
    function checkCode() {
      const enteredCode = Array.from(inputs).map(i => i.value).join('');
      if (enteredCode.length === 6) {
        console.log('Введен код:', enteredCode);
        // Здесь можно добавить проверку пароля, например:
        // if (enteredCode.toUpperCase() === '123456') { alert('Верно!'); }
      }
    }
  </script>
</body>
</html>
