<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Попробуй ещё раз</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Manrope:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      background-color: #5C7C36;
      overflow: hidden;
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Manrope', sans-serif;
    }

    /* Контейнер на весь экран телефона (If false) */
    .screen {
      position: relative;
      width: 100%;
      max-width: 402px;
      height: 100%;
      background: rgba(79, 122, 37, 0.92);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Центральный блок: плашка с текстом + грустный кот */
    .center-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
      padding: 0 16px;
    }

    /* Светло-зелёная плашка с текстом */
    .message-box {
      width: 220px;
      height: 105px;
      background-color: #B4D788;
      border: 1px solid #3D5B20;
      border-radius: 36px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    .message-box:active {
      transform: scale(0.97);
      background-color: #A7CC7A;
    }

    .message-text {
      font-family: 'Manrope', sans-serif;
      font-size: 16px;
      font-weight: 400;
      color: #1E2814;
      line-height: 1.3;
    }

    /* Картинка с котом в душе */
    .cat-image {
      width: 220px;
      height: 220px;
      object-fit: cover;
      user-select: none;
    }
  </style>
</head>
<body>

  <div class="screen" id="screen">
    <!-- Центральный блок с сообщением и котом -->
    <div class="center-content">
      <div class="message-box" id="retryBtn" role="button" tabindex="0">
        <span class="message-text">Попробуй ещё раз! :(</span>
      </div>

      <img src="sad-cat.jpg" alt="Грустный кот" class="cat-image">
    </div>
  </div>

  <script>
    const retryBtn = document.getElementById('retryBtn');

    // Автоматический возврат на предыдущую страницу через 3 секунды
    const redirectTimer = setTimeout(() => {
      window.history.back();
    }, 2000);

    // Если пользователь нажал на плашку раньше — возвращаемся сразу
    retryBtn.addEventListener('click', () => {
      clearTimeout(redirectTimer);
      window.history.back();
    });
  </script>


</body>
</html>
