<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Подарочек</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://googleapis.com" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      background-color: rgba(114, 180, 47, 0.92);
      overflow: hidden;
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', sans-serif;
    }

    /* Контейнер экрана телефона */
    .screen {
      position: relative;
      width: 100%;
      max-width: 402px;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }

    /* Сердечки в левом верхнем углу */
    .hearts-img {
      position: absolute;
      top: 39px;
      left: 17px;
      width: 129px;
      height: 129px;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      z-index: 1;
    }

    /* Основной блок с карточкой и фото */
    .content-wrapper {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 50px; /* Небольшой отступ вниз от сердечек */
    }

    /* Светло-зеленая карточка (Frame 6) */
    .card {
      width: 285px;
      min-height: 285px;
      background: rgba(240, 239, 210, 0.45);
      border-radius: 10px;
      padding: 33px 16px 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      font-weight: 600;
      font-size: 18px;
      line-height: 22px;
      color: rgba(79, 122, 37, 0.92);
    }

    .card p {
      margin-bottom: 18px;
    }

    /* Ссылка на Instagram (выглядит как обычный текст, но кликабельна) */
    .insta-link {
      color: inherit;
      text-decoration: none;
    }

    /* Красный акцент в конце */
    .love-text {
      color: #D83A1E;
      margin-top: 8px;
      margin-bottom: 0 !important;
    }

    .pip {
      color: azure;
    }

    /* Фотография снизу */
    .couple-photo {
      width: 278px;
      height: 278px;
      object-fit: contain;
      margin-top: -20px; /* Слегка заходит на карточку, как в макете (457px vs 192+285=477px) */
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>

  <div class="screen">
    <!-- Декор: сердечки -->
    <img src="hearts.png" alt="" class="hearts-img">

    <!-- Центральный контент -->
    <div class="content-wrapper">
      <div class="card">
        <div>
          <p class="pip">Квест пройден!</p>
          <p>Твой подарочек у</p>
          <p>inst: <a href="https://www.instagram.com/pavlikov_anton?cnvx=ajMwcGkyNGczYXdh" target="_blank" class="insta-link">@pavlikov_anton</a></p>
          <p>(напиши мне — я объясню)))</p>
        </div>
        <p class="love-text">лю тя!</p>
      </div>

      <!-- Фото пары -->
      <img src="foto.png" alt="Мы" class="couple-photo">
    </div>
  </div>

</body>
</html>
